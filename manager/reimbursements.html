<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07080a">
  <title>Reimbursements · ExpenseX Corporate</title>
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png">
  <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
</head>
<body data-root="../">
  <main id="main" class="page" tabindex="-1" hidden>
    <div class="page-header">
      <div>
        <h2>Reimbursements</h2>
        <p>Approving an expense creates a separate reimbursement record. Marking it reimbursed records who paid and when;
          the original expense is never changed.</p>
      </div>
    </div>

    <section aria-label="Reimbursement totals"><div class="stats stats-4" id="stats"></div></section>

    <div class="tabs" role="group" aria-label="Show">
      <button class="tab" type="button" data-tab="pending" aria-pressed="true">Reimbursement pending</button>
      <button class="tab" type="button" data-tab="reimbursed" aria-pressed="false">Reimbursed</button>
    </div>

    <form class="toolbar" id="toolbar" role="search" aria-label="Filter reimbursements" onsubmit="return false">
      <div class="field toolbar-search">
        <label for="search">Search</label>
        <input class="control" id="search" name="search" type="search" placeholder="Expense, employee, project, reference…">
      </div>
      <div class="field"><label for="employeeId">Employee</label><select class="control" id="employeeId" name="employeeId"></select></div>
    </form>

    <p class="result-count" id="count" aria-live="polite"></p>
    <div id="table"></div>
  </main>

  <script src="../js/core/constants.js"></script>
  <script src="../js/core/storage.js"></script>
  <script src="../js/core/money.js"></script>
  <script src="../js/core/dates.js"></script>
  <script src="../js/core/validate.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/permissions.js"></script>
  <script src="../js/notifications.js"></script>
  <script src="../js/activity.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/users.js"></script>
  <script src="../js/projects.js"></script>
  <script src="../js/limits.js"></script>
  <script src="../js/receipts.js"></script>
  <script src="../js/expenses.js"></script>
  <script src="../js/reimbursements.js"></script>
  <script src="../js/analytics.js"></script>
  <script src="../js/charts.js"></script>
  <script src="../js/settings.js"></script>
  <script src="../js/expense-view.js"></script>
  <script src="../js/guard.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/pages/manager-reimbursements.js"></script>
</body>
</html>
