<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07080a">
  <title>Team · ExpenseX Corporate</title>
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png">
  <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
  <link rel="stylesheet" href="../css/base.css">

<body data-root="../">
  <main id="main" class="page" tabindex="-1" hidden>
    <div class="page-header">
      <div>
        <h2>My team</h2>
        <p id="summary"></p>
      </div>
      <button class="btn btn-primary" type="button" id="add-employee">Add employee</button>
    </div>

    <section aria-label="Team limits summary"><div class="stats stats-4" id="stats"></div></section>

    <div class="callout callout-info" style="margin-bottom:16px">
      <span aria-hidden="true" data-icon="info"></span>
      <p>Monthly limits are <strong>warnings only</strong>: employees can still submit over their limit and you will see a flag.
        Reassigning employees, deactivating accounts and changing roles are done by an Admin.</p>
    </div>

    <div id="team"></div>
  </main>

  <script src="../js/core/constants.js"></script>
  <script src="../js/core/storage.js"></script>
  <script src="../js/core/money.js"></script>
  <script src="../js/core/dates.js"></script>
  <script src="../js/core/validate.js"></script>
  <script src="../js/ui.js"></script>

  <script src="../js/projects.js"></script>
  <script src="../js/limits.js"></script>
  <script src="../js/receipts.js"></script>
  <script src="../js/expenses.js"></script>
  <script src="../js/reimbursements.js"></script>
  <script src="../js/analytics.js"></script>
  <script src="../js/charts.js"></script>
  <script src="../js/settings.js"></script>
  <script src="../js/expense-view.js"></script>
  <script src="../js/guard.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/pages/manager-team.js"></script>
</body>
</html>
