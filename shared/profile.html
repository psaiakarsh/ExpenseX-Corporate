<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07080a">
  <title>Profile · ExpenseX Corporate</title>
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png">
  <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
</head>
<body data-root="../">
  <main id="main" class="page" tabindex="-1" hidden>
    <div class="grid-2">
      <div class="stack">
        <section class="card" aria-labelledby="account-title">
          <div class="card-header"><h2 id="account-title">Account</h2><span id="role-badge"></span></div>
          <dl class="details" id="account-details"></dl>
        </section>
        <section class="card" aria-labelledby="work-title" id="work-card">
          <div class="card-header"><h2 id="work-title">Work</h2></div>
          <div id="work-details"></div>
        </section>
        <section class="card" aria-labelledby="session-title">
          <div class="card-header"><h2 id="session-title">Session</h2></div>
          <p class="muted small" style="margin-bottom:16px">You stay logged in on this browser until you log out.
            Your role and team are managed by an administrator and can't be changed here.</p>
          <button class="btn btn-ghost" type="button" id="logout-button">Log out</button>
        </section>
      </div>

      <div class="stack">
        <section class="card" aria-labelledby="name-title">
          <div class="card-header"><h2 id="name-title">Display name</h2></div>
          <form id="name-form" class="form" novalidate>
            <div class="field">
              <label for="name">Full name</label>
              <input id="name" name="name" autocomplete="name" required maxlength="50" aria-describedby="name-error">
              <p class="field-error" id="name-error" data-error-for="name" hidden></p>
            </div>
            <p class="form-error" role="alert" data-form-error hidden></p>
            <div class="form-actions"><button class="btn btn-primary" type="submit">Save name</button></div>
          </form>
        </section>

        <section class="card" aria-labelledby="password-title">
          <div class="card-header"><h2 id="password-title">Change password</h2></div>
          <form id="password-form" class="form" novalidate>
            <div class="field">
              <label for="currentPassword">Current password</label>
              <input id="currentPassword" name="currentPassword" type="password" autocomplete="current-password" required aria-describedby="currentPassword-error">
              <p class="field-error" id="currentPassword-error" data-error-for="currentPassword" hidden></p>
            </div>
            <div class="field">
              <label for="newPassword">New password</label>
              <input id="newPassword" name="newPassword" type="password" autocomplete="new-password" required maxlength="72" aria-describedby="newPassword-error">
              <p class="field-error" id="newPassword-error" data-error-for="newPassword" hidden></p>
            </div>
            <div class="field">
              <label for="confirmPassword">Confirm new password</label>
              <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required maxlength="72" aria-describedby="confirmPassword-error">
              <p class="field-error" id="confirmPassword-error" data-error-for="confirmPassword" hidden></p>
            </div>
            <p class="form-error" role="alert" data-form-error hidden></p>
            <div class="form-actions"><button class="btn btn-primary" type="submit">Change password</button></div>
          </form>
        </section>
      </div>
    </div>
  </main>

  <script src="../js/core/constants.js"></script>
  <script src="../js/core/storage.js"></script>
  <script src="../js/core/money.js"></script>
  <script src="../js/core/dates.js"></script>
  <script src="../js/core/validate.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/permissions.js"></script>
  <script src="../js/notifications.js"></script>
  <script src="../js/activity.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/users.js"></script>
  <script src="../js/projects.js"></script>
  <script src="../js/limits.js"></script>
  <script src="../js/receipts.js"></script>
  <script src="../js/expenses.js"></script>
  <script src="../js/reimbursements.js"></script>
  <script src="../js/analytics.js"></script>
  <script src="../js/charts.js"></script>
  <script src="../js/settings.js"></script>
  <script src="../js/expense-view.js"></script>
  <script src="../js/guard.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/pages/profile.js"></script>
</body>
</html>
